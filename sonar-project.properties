# Configuración del análisis de SonarCloud (issue #13)
# Organización y proyecto creados por el owner del repo en sonarcloud.io.
sonar.organization=nicolasaharonian
sonar.projectKey=nicolasaharonian_DevOps-Tero-2026
sonar.projectName=DevOps-Tero-2026

# Qué se analiza: el código de los 6 microservicios
sonar.sources=src
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Qué NO se analiza: dependencias de terceros, archivos generados y estáticos
sonar.exclusions=**/*.md,**/node_modules/**,**/dist/**,**/public/**,**/*.lock,**/package-lock.json,**/go.sum

# Coverage: los servicios no tienen tests unitarios (el testing elegido es de
# integración con Newman, issue #12), así que no hay reporte de coverage que
# importar. Se excluye todo de la métrica para que la condición de coverage
# del quality gate no aplique en vez de dar 0% y bloquear todo.
sonar.coverage.exclusions=**/*

# Esperar el resultado del quality gate: si SonarCloud dice "Failed",
# el job del CI falla y el PR no se puede mergear.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
