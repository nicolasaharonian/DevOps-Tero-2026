# CI de Pull Requests (issue #9)
# Cada vez que alguien abre o actualiza un PR hacia main, GitHub levanta una
# máquina limpia y construye la imagen Docker de cada microservicio.
# Si alguna no compila, el PR queda en rojo y no se debería mergear.
name: CI
 
on:
  pull_request:
    branches: [main]
  workflow_dispatch: # permite correrlo a mano desde la pestaña Actions
 
# Si se hace un push nuevo al mismo PR, se cancela la corrida vieja.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
 
# Mínimo privilegio: el workflow solo necesita leer el código.
permissions:
  contents: read
 
jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false # si falla un servicio, igual seguimos viendo el resultado de los demás
      matrix:
        service: [ui, catalog, cart, orders, checkout, admin]
    steps:
      - name: Descargar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
 
      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
 
      - name: Construir imagen de ${{ matrix.service }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./src/${{ matrix.service }}
          push: false # en el CI de PR solo construimos; publicar en ECR es el issue #10
          tags: tero/${{ matrix.service }}:pr-${{ github.event.pull_request.number || 'manual' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  gitleaks:
    name: Secretos (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Descargar el código
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Buscar secretos con Gitleaks
      run: |
        docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.21.2 \
          dir /repo -v --redact --config /repo/.gitleaks.toml
  
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Analizar el código con Semgrep
        run: |
          docker run --rm -v "$PWD":/src semgrep/semgrep:1.95.0 \
            semgrep scan --config p/default --metrics=off \
            --error --severity ERROR
 
