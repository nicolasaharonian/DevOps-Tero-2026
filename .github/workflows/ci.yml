# CI de Pull Requests (issue #9)
# Cada vez que alguien abre o actualiza un PR hacia main, GitHub ejecuta:
#   - build:     construye la imagen Docker de cada microservicio
#   - scan:      cuando build termina bien, escanea cada imagen con Trivy
#   - gitleaks:  busca secretos expuestos en el código
#   - semgrep:   busca código inseguro (SAST)
#   - trivy-fs:  busca vulnerabilidades conocidas en las dependencias (SCA)
#   - sonarcloud: análisis estático de calidad con quality gate (issue #13)
# Si algún job falla, el PR queda en rojo.
#
# Criterios comunes:
#   - Todas las herramientas de seguridad se ejecutan igual: con su imagen Docker
#     oficial y una versión fija (docker run <herramienta>:<versión>).
#   - Las acciones de GitHub están fijadas por SHA de commit (no por tag como @v4)
#     para evitar ataques de supply chain. El comentario indica la versión.

name: CI

on:
  pull_request:
    branches: [main]
  # También corre al mergear a main: SonarCloud necesita analizar main para
  # tener la "foto" completa del proyecto y comparar los PRs contra ella.
  push:
    branches: [main]
  workflow_dispatch: # permite correrlo a mano desde la pestaña Actions

# Si se hace un push nuevo al mismo PR, se cancela la corrida vieja.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Mínimo privilegio: el workflow solo necesita leer el código.
permissions:
  contents: read

env:
  IMAGE_TAG: pr-${{ github.event.pull_request.number || 'manual' }}

jobs:
  # ---------------------------------------------------------------
  # 1. Build de las imágenes
  # ---------------------------------------------------------------
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [ui, catalog, cart, orders, checkout, admin]

    steps:
      - name: Descargar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Construir imagen de ${{ matrix.service }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./src/${{ matrix.service }}
          push: false # en el CI de PR solo construimos; publicar en ECR es el issue #10
          tags: tero/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.version=${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'manual' }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ---------------------------------------------------------------
  # 2. Escaneo de las imágenes (Trivy image) - requisito 5.3
  # Cada job corre en una máquina distinta: la imagen del job build no existe
  # acá, así que se vuelve a construir con load: true. Reutiliza la caché de
  # build (cache-from), por lo que tarda segundos.
  # ---------------------------------------------------------------
  scan:
    name: Scan de seguridad ${{ matrix.service }} (Trivy)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [ui, catalog, cart, orders, checkout, admin]
    steps:
      - name: Checkout código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build imagen para escaneo
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./src/${{ matrix.service }}
          push: false
          load: true
          tags: tero/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.version=${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'manual' }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}

      # Quality gate: falla si hay vulnerabilidades HIGH o CRITICAL
      # con arreglo disponible. Las que no tienen parche se ignoran.
      - name: Escaneo Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD":/src \
            aquasec/trivy:0.57.0 image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile /src/.trivyignore \
            tero/${{ matrix.service }}:${{ env.IMAGE_TAG }}

  # ---------------------------------------------------------------
  # 3. Secretos en el código (Gitleaks) - requisito 5.7
  # ---------------------------------------------------------------
  gitleaks:
    name: Secretos (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Buscar secretos con Gitleaks
        run: |
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.21.2 \
            dir /repo -v --redact --config /repo/.gitleaks.toml

  # ---------------------------------------------------------------
  # 4. Código inseguro (Semgrep, SAST) - requisito 5.4
  # ---------------------------------------------------------------

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Analizar el código con Semgrep
        run: |
          docker run --rm -v "$PWD":/src semgrep/semgrep:1.95.0 \
            semgrep scan --config p/default --metrics=off \
            --error --severity ERROR

  # ---------------------------------------------------------------
  # 5. Dependencias vulnerables (Trivy fs, SCA) - requisitos 5.1 y 5.2
  # ---------------------------------------------------------------

  trivy-fs:
    name: SCA dependencias (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Escaneo Trivy de dependencias
        run: |
          docker run --rm -v "$PWD":/src aquasec/trivy:0.57.0 fs \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            /src

  # ---------------------------------------------------------------
  # 6. Calidad de código (SonarCloud) - requisitos 4.2 y 4.3
  # Analiza bugs, code smells, duplicación y vulnerabilidades del código y
  # aplica el quality gate "Sonar way" sobre el código nuevo del PR:
  #   - Reliability, Security y Maintainability rating = A (sin bugs,
  #     vulnerabilidades ni code smells relevantes nuevos)
  #   - Duplicación en código nuevo <= 3%
  #   - 100% de los Security Hotspots nuevos revisados
  #   - Coverage: no aplica (ver sonar-project.properties)
  # La configuración está en sonar-project.properties (raíz del repo).
  # El token se guarda como secreto del repo (SONAR_TOKEN), nunca en el código.
  # ---------------------------------------------------------------

  sonarcloud:
    name: Quality Gate (SonarCloud)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # historial completo: Sonar lo usa para saber qué código es nuevo

      # Mismo esquema que el laboratorio 04-SonarCloud (checkout con historial +
      # acción de Sonar + SONAR_TOKEN). Diferencia: el lab usa
      # sonarcloud-github-action@master, que Sonar marcó como deprecada; usamos
      # su reemplazo oficial, sonarqube-scan-action, fijado por SHA.
      - name: Análisis SonarCloud
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
