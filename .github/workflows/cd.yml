# CD: publicación en ECR (issue #10) y promoción Dev -> Test -> Prod (issue #11)
#
# Cada vez que se mergea algo a main:
#   1. version:     calcula el tag de esta versión = SHA corto del commit.
#   2. publish:     construye la imagen de cada servicio, la escanea con Trivy
#                   y, si no tiene vulnerabilidades graves, la sube a ECR
#                   (por ejemplo tero/catalog:a1b2c3d).
#   3. deploy-dev:  la despliega en dev y corre Newman contra dev.
#   4. deploy-test: SOLO si dev pasó, despliega la MISMA imagen en test y
#                   vuelve a correr Newman.
#   5. deploy-prod: SOLO si test pasó y alguien del equipo lo aprueba
#                   (environment prod con required reviewers), despliega la
#                   MISMA imagen en prod y hace una prueba de humo.
# La imagen se construye una sola vez (paso 2) y los tres ambientes usan el
# mismo tag: "build once, promote many". Los pasos del despliegue están en
# deploy.yml (workflow reutilizable). Ver docs/infra/cd.md.
#
# Los quality gates del código (build, Trivy, Gitleaks, Semgrep, SCA,
# SonarCloud y Newman) ya corrieron en el PR: el ruleset de main los exige
# y además exige que la rama esté al día, así que el commit que llega acá
# es exactamente el que pasó esos controles.

name: CD

on:
  push:
    branches: [main]
  workflow_dispatch: # permite correrlo a mano desde la pestaña Actions

# No hay concurrency a nivel de workflow: si lo hubiera, una corrida
# esperando la aprobación de prod (puede ser por días) frenaría el deploy a
# dev de los merges siguientes. El control "un deploy a la vez por ambiente"
# está en deploy.yml.

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  # ---------------------------------------------------------------
  # 1. La versión: un único tag para todo el recorrido
  # ---------------------------------------------------------------
  version:
    name: Calcular versión
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Tag = primeros 7 caracteres del commit
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------
  # 2. Build + Trivy + push a ECR (issue #10)
  # ---------------------------------------------------------------
  publish:
    name: Publicar ${{ matrix.repo }} en ECR
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false

      matrix:
        # dir  = carpeta del servicio dentro de src/
        # repo = repositorio en ECR (tero/<repo>)
        # Solo difieren en el carrito: la carpeta es "cart" y el repositorio "carts".

        include:
          - { dir: ui, repo: ui }
          - { dir: catalog, repo: catalog }
          - { dir: cart, repo: carts }
          - { dir: orders, repo: orders }
          - { dir: checkout, repo: checkout }
          - { dir: admin, repo: admin }

    steps:
      - name: Descargar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Credenciales de Learner Lab guardadas como secrets del repo.
      # Vencen al terminar la sesión del lab: hay que actualizarlas antes de publicar.

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Iniciar sesión en ECR

        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Definir nombre de la imagen
        id: image

        env:
          REGISTRO: ${{ steps.ecr.outputs.registry }}
          SERVICIO: ${{ matrix.repo }}
          TAG: ${{ needs.version.outputs.tag }} # el mismo tag que después se despliega

        run: |
          IMAGEN="$REGISTRO/tero/$SERVICIO:$TAG"  # ej: 5642...amazonaws.com/tero/catalog:a1b2c3d
          echo "name=$IMAGEN" >> "$GITHUB_OUTPUT"

      # Los tags de ECR son inmutables: si esta versión ya se publicó (por
      # ejemplo en un intento anterior de esta misma corrida), no se puede
      # volver a subir. En ese caso se saltean build, Trivy y push: la imagen
      # que está en ECR ya pasó Trivy cuando se publicó. Así "Re-run failed
      # jobs" funciona y el CD sigue a Dev con la misma imagen.
      - name: ¿Ya está publicada esta versión?
        id: existe

        env:
          SERVICIO: ${{ matrix.repo }}
          TAG: ${{ needs.version.outputs.tag }}

        run: |
          if aws ecr describe-images --repository-name "tero/$SERVICIO" \
               --image-ids imageTag="$TAG" > /dev/null 2>&1; then
            echo "tero/$SERVICIO:$TAG ya está en ECR: no se vuelve a publicar"
            echo "publicada=true" >> "$GITHUB_OUTPUT"
          else
            echo "publicada=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Construir imagen
        if: steps.existe.outputs.publicada != 'true'

        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6

        with:
          context: ./src/${{ matrix.dir }}
          push: false # se sube recién después del escaneo
          load: true # deja la imagen en el Docker local para escanearla
          tags: ${{ steps.image.outputs.name }}
          cache-from: type=gha,scope=${{ matrix.dir }}

      # Quality gate: si hay vulnerabilidades HIGH/CRITICAL con arreglo disponible,
      # el job falla acá y la imagen NO se publica.

      - name: Escanear imagen con Trivy
        if: steps.existe.outputs.publicada != 'true'

        env:
          IMAGEN: ${{ steps.image.outputs.name }}

        run: |

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD":/src \
            aquasec/trivy:0.57.0 image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --ignorefile /src/.trivyignore \
              "$IMAGEN"

      - name: Publicar en ECR
        if: steps.existe.outputs.publicada != 'true'

        env:
          IMAGEN: ${{ steps.image.outputs.name }}

        run: docker push "$IMAGEN"

  # ---------------------------------------------------------------
  # 3. Dev: automático en cada merge a main
  # needs: publish -> si alguna de las 6 imágenes no pasó Trivy o no se
  # publicó, no se despliega nada.
  # ---------------------------------------------------------------
  deploy-dev:
    name: Dev
    needs: [version, publish]
    if: github.ref == 'refs/heads/main' # un workflow_dispatch desde otra rama no despliega
    uses: ./.github/workflows/deploy.yml
    with:
      ambiente: dev
      image_tag: ${{ needs.version.outputs.tag }}
      pruebas: completas
    # Solo las 3 credenciales de AWS (no "secrets: inherit", que pasaría todos)
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

  # ---------------------------------------------------------------
  # 4. Test: solo si dev quedó bien (deploy + versión correcta + Newman)
  # ---------------------------------------------------------------
  deploy-test:
    name: Test
    needs: [version, deploy-dev]
    uses: ./.github/workflows/deploy.yml
    with:
      ambiente: test
      image_tag: ${{ needs.version.outputs.tag }}
      pruebas: completas
    # Solo las 3 credenciales de AWS (no "secrets: inherit", que pasaría todos)
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

  # ---------------------------------------------------------------
  # 5. Prod: solo si test quedó bien Y alguien lo aprueba en GitHub
  # (el environment prod tiene required reviewers). Prueba de humo de
  # solo lectura para no crear compras falsas en la tienda real.
  # ---------------------------------------------------------------
  deploy-prod:
    name: Prod
    needs: [version, deploy-test]
    uses: ./.github/workflows/deploy.yml
    with:
      ambiente: prod
      image_tag: ${{ needs.version.outputs.tag }}
      pruebas: humo
    # Solo las 3 credenciales de AWS (no "secrets: inherit", que pasaría todos)
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
